<!-- A Rotterdam windmill silhouette (smock mill on a hill, X-shaped lattice sails), one color, for faint use on navy. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 260" fill="#ffffff">
  <defs>
    <g id="sail">
      <rect x="-2" y="-104" width="4" height="96"/>
      <path d="M2 -102 h20 v84 h-20 Z M5 -99 v78 h14 v-78 Z" fill-rule="evenodd"/>
      <rect x="2" y="-88" width="20" height="2.5"/><rect x="2" y="-74" width="20" height="2.5"/>
      <rect x="2" y="-60" width="20" height="2.5"/><rect x="2" y="-46" width="20" height="2.5"/>
      <rect x="2" y="-32" width="20" height="2.5"/>
    </g>
  </defs>
  <!-- hill -->
  <path d="M0 260 C40 236 70 226 120 224 C170 222 205 234 240 252 L240 260 Z"/>
  <!-- tower and cap -->
  <polygon points="92,228 148,228 138,118 102,118"/>
  <path d="M98 121 C100 100 140 100 142 121 Z"/>
  <!-- four lattice sails around the hub -->
  <g transform="translate(120 108)">
    <use href="#sail" xlink:href="#sail" transform="rotate(45)"/>
    <use href="#sail" xlink:href="#sail" transform="rotate(135)"/>
    <use href="#sail" xlink:href="#sail" transform="rotate(225)"/>
    <use href="#sail" xlink:href="#sail" transform="rotate(315)"/>
    <circle r="7"/>
  </g>
</svg>
