<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Rotterdam Scouts Food Drive - Results Graphic</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* 1080 x 1080 results post after pickup day, Sunday 11/15; same campaign look as the other squares. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { position: relative; background: radial-gradient(circle at 82% 12%, #1d4f9a 0%, #003f87 42%, #002a5c 100%); color: #fff;
    font-family: 'Montserrat', sans-serif; padding: 72px 80px; }
  .eyebrow { display: inline-block; border: 3px solid #c4b596; border-radius: 40px; padding: 10px 28px;
    font-weight: 700; font-size: 26px; letter-spacing: 7px; color: #e3d5b2; }
  h1 { font-weight: 800; font-size: 96px; line-height: 0.98; margin-top: 30px; width: 640px; }
  h1 span { color: #f2c94c; }
  .bag { position: absolute; right: 64px; top: 150px; width: 280px; height: 280px; }
  .mill { position: absolute; right: 300px; top: 210px; height: 420px; width: auto; opacity: 0.1; }
  .big { position: absolute; left: 80px; right: 80px; top: 452px; background: rgba(255,255,255,0.1); border-top: 6px solid #f2c94c;
    border-radius: 12px; padding: 18px 30px 22px; display: flex; align-items: center; gap: 30px; }
  .big b { font-weight: 900; font-size: 208px; line-height: 1; letter-spacing: -6px; color: #f2c94c; }
  .big span { font: 700 34px/1.2 'Open Sans', sans-serif; color: #f4efe3; }
  .small { position: absolute; left: 80px; right: 80px; top: 726px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .small div { background: rgba(255,255,255,0.1); border-left: 6px solid #c4b596; border-radius: 10px; padding: 14px 22px;
    display: flex; align-items: baseline; gap: 14px; }
  .small b { font-weight: 800; font-size: 50px; line-height: 1; }
  .small span { font: 700 23px/1.2 'Open Sans', sans-serif; color: #e3d5b2; }
  .who { position: absolute; left: 80px; right: 80px; top: 846px; font: 700 26px/1.3 'Open Sans', sans-serif; color: #f4efe3; }
  /* Same light band as the other square graphics, so both partners' logos keep their colors. */
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 148px; background: #f8f5ee; border-top: 8px solid #ad9d7b;
    color: #002a5c; display: flex; align-items: center; justify-content: space-between; padding: 0 70px; }
  .foot .url { font-weight: 800; font-size: 34px; }
  .foot .sub { font-weight: 700; font-size: 18px; letter-spacing: 3px; color: #6b5f45; margin-top: 6px; }
  .foot .logos { display: flex; align-items: center; gap: 26px; }
  .foot .logos .sa { height: 92px; }
  .foot .logos .rcc { height: 52px; }
  .foot .logos .rule { width: 2px; height: 72px; background: #d6cebd; }
</style>
</head>
<body>
  <div class="eyebrow">ROTTERDAM SCOUTS FOOD DRIVE</div>
  <h1>Thank you, <span>Rotterdam!</span></h1>
  <img class="mill" src="../mill.svg" alt="">
  <img class="bag" src="../bag.png" alt="">
  <div class="big"><b>2,059</b><span>items to feed our neighbors</span></div>
  <div class="small">
    <div><b>1,637</b><span>homes got a flier</span></div>
    <div><b>25</b><span>pickup routes</span></div>
  </div>
  <div class="who">Troop 3054 · Pack 3054 · Girl Scout Troop 5152</div>
  <div class="foot">
    <div><div class="url">troop3054.org/food-drive</div><div class="sub">IT ALL STAYS IN OUR COMMUNITY</div></div>
    <div class="logos"><img class="sa" src="../scouting-america.png" alt="Scouting America"><span class="rule"></span><img class="rcc" src="../rcc-logo.png" alt="Rotterdam Community Center"></div>
  </div>
</body>
</html>
