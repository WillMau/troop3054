<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Rotterdam Scouts Food Drive - Thank You Graphic</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* 1080 x 1080 thank-you after flier day; pairs with food-drive-social.png as the second image. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { position: relative; background: radial-gradient(circle at 82% 12%, #1d4f9a 0%, #003f87 42%, #002a5c 100%); color: #fff;
    font-family: 'Montserrat', sans-serif; padding: 72px 80px; }
  .eyebrow { display: inline-block; border: 3px solid #c4b596; border-radius: 40px; padding: 10px 28px;
    font-weight: 700; font-size: 26px; letter-spacing: 7px; color: #e3d5b2; }
  h1 { font-weight: 800; font-size: 96px; line-height: 0.98; margin-top: 30px; width: 640px; }
  h1 span { color: #f2c94c; }
  .bag { position: absolute; right: 64px; top: 150px; width: 280px; height: 280px; }
  .mill { position: absolute; right: 300px; top: 210px; height: 420px; width: auto; opacity: 0.1; }
  .stats { position: absolute; left: 80px; right: 80px; top: 470px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .stat { background: rgba(255,255,255,0.1); border-top: 6px solid #f2c94c; border-radius: 12px; padding: 22px 26px 24px; }
  .stat b { display: block; font-weight: 800; font-size: 118px; line-height: 1; letter-spacing: -2px; }
  .stat span { display: block; font: 700 25px/1.25 'Open Sans', sans-serif; color: #e3d5b2; margin-top: 10px; }
  .who { position: absolute; left: 80px; right: 80px; top: 728px; font: 700 27px/1.3 'Open Sans', sans-serif; color: #f4efe3; }
  .next { position: absolute; left: 80px; bottom: 182px; display: flex; align-items: stretch; border-radius: 40px; overflow: hidden;
    box-shadow: 0 8px 22px rgba(0,0,0,.3); }
  .next .k { background: #ce1126; font-weight: 800; font-size: 25px; letter-spacing: 4px; padding: 13px 22px; }
  .next .v { background: #fff; color: #003f87; font-weight: 800; font-size: 25px; padding: 13px 26px; }
  /* Same light band as the square graphic, so both partners' logos keep their colors. */
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 148px; background: #f8f5ee; border-top: 8px solid #ad9d7b;
    color: #002a5c; display: flex; align-items: center; justify-content: space-between; padding: 0 70px; }
  .foot .url { font-weight: 800; font-size: 34px; }
  .foot .sub { font-weight: 700; font-size: 18px; letter-spacing: 3px; color: #6b5f45; margin-top: 6px; }
  .foot .logos { display: flex; align-items: center; gap: 26px; }
  .foot .logos .sa { height: 92px; }
  .foot .logos .rcc { height: 52px; }
  .foot .logos .rule { width: 2px; height: 72px; background: #d6cebd; }
</style>
</head>
<body>
  <div class="eyebrow">ROTTERDAM SCOUTS FOOD DRIVE</div>
  <h1>Thank you, <span>Rotterdam Scouts!</span></h1>
  <img class="mill" src="../mill.svg" alt="">
  <img class="bag" src="../bag.png" alt="">
  <div class="stats">
    <div class="stat"><b>1,637</b><span>doors got a flier</span></div>
    <div class="stat"><b>32</b><span>hours on foot</span></div>
  </div>
  <div class="who">Troop 3054 · Pack 3054 · Girl Scout Troop 5152</div>
  <div class="next"><span class="k">NEXT</span><span class="v">Sunday, Nov 15 · Drop off 10 AM to 2 PM</span></div>
  <div class="foot">
    <div><div class="url">troop3054.org/food-drive</div><div class="sub">DROP-OFF · 705 CURRY RD, ROTTERDAM</div></div>
    <div class="logos"><img class="sa" src="../scouting-america.png" alt="Scouting America"><span class="rule"></span><img class="rcc" src="../rcc-logo.png" alt="Rotterdam Community Center"></div>
  </div>
</body>
</html>
