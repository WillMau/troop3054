<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Rotterdam Scouts Food Drive - Facebook Event Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@600&display=swap" rel="stylesheet">
<style>
  /* 1920 x 1005 for the Facebook event cover. The event page already lists the
     date, time and place under the cover, so this one is about the drop-off. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1005px; overflow: hidden; }
  body { position: relative; background: radial-gradient(circle at 80% 14%, #1d4f9a 0%, #003f87 42%, #002a5c 100%); color: #fff;
    font-family: 'Montserrat', sans-serif; padding: 128px 110px 0; }
  .eyebrow { display: inline-block; border: 3px solid #c4b596; border-radius: 40px; padding: 10px 30px;
    font-weight: 700; font-size: 28px; letter-spacing: 8px; color: #e3d5b2; }
  h1 { font-weight: 800; font-size: 120px; line-height: 1.0; margin-top: 34px; }
  h1 span { color: #f2c94c; }
  .when { display: flex; align-items: center; gap: 36px; margin-top: 46px; }
  .cal { width: 176px; background: #fff; border-radius: 18px; overflow: hidden; text-align: center; box-shadow: 0 10px 28px rgba(0,0,0,.35); }
  .cal .m { background: #ce1126; font-weight: 800; font-size: 30px; letter-spacing: 4px; padding: 8px 0; }
  .cal .d { color: #003f87; font-weight: 800; font-size: 88px; line-height: 1; padding-top: 10px; }
  .cal .w { color: #003f87; font-weight: 700; font-size: 18px; letter-spacing: 4px; padding: 6px 0 14px; }
  .whentext b { display: block; font-weight: 800; font-size: 60px; }
  .whentext span { display: block; color: #e3d5b2; font: 600 34px 'Open Sans', sans-serif; margin-top: 8px; line-height: 1.3; }
  .whentext em { font-style: normal; display: block; color: #f4efe3; font: 600 28px 'Open Sans', sans-serif; margin-top: 14px; }
  .bag { position: absolute; right: 130px; top: 170px; width: 510px; height: 510px; }
  /* The windmill's hill sits on the footer band like ground. */
  .mill { position: absolute; right: 560px; bottom: 150px; height: 660px; width: auto; opacity: 0.1; }
  /* Same light band as the square graphic, so both partners' logos keep their colors. */
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: #f8f5ee; border-top: 8px solid #ad9d7b;
    color: #002a5c; display: flex; align-items: center; justify-content: space-between; padding: 0 110px; }
  .foot .url { font-weight: 800; font-size: 38px; }
  .foot .who { font-weight: 700; font-size: 19px; letter-spacing: 3px; color: #6b5f45; margin-top: 6px; }
  .foot .logos { display: flex; align-items: center; gap: 30px; }
  .foot .logos .sa { height: 94px; }
  .foot .logos .rcc { height: 54px; }
  .foot .logos .rule { width: 2px; height: 74px; background: #d6cebd; }
</style>
</head>
<body>
  <div class="eyebrow">ROTTERDAM SCOUTS FOOD DRIVE</div>
  <h1>Drop off food<br>for <span>our neighbors</span></h1>
  <div class="when">
    <div class="cal"><div class="m">NOV</div><div class="d">15</div><div class="w">SUNDAY</div></div>
    <div class="whentext"><b>10&nbsp;AM to 2&nbsp;PM</b><span>Rotterdam Community Center · 705 Curry Rd</span>
      <em>Just pull up. Scouts will take it right from your car.</em></div>
  </div>
  <img class="mill" src="../mill.svg" alt="">
  <img class="bag" src="../bag.png" alt="">
  <div class="foot">
    <div><div class="url">troop3054.org/food-drive</div><div class="who">TROOP 3054 · PACK 3054</div></div>
    <div class="logos"><img class="sa" src="../scouting-america.png" alt="Scouting America"><span class="rule"></span><img class="rcc" src="../rcc-logo.png" alt="Rotterdam Community Center"></div>
  </div>
</body>
</html>
